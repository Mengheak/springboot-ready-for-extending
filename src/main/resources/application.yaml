spring:
  application:
    name: springboot-setup-heakcg
  profiles:
    active:
      - ${ACTIVE_PROFILE}
  datasource:
    dbcp2:
      driver-class-name: org.postgresql.Driver
# endpoints prefix
server:
  servlet:
    context-path: /api

#--- Client JWT
application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000
      refresh-token:
        expiration: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


